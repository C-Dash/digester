[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdash-digester"
version = "0.1.0"
description = "CDASH Presort Digester — batch folder validator and media cataloguer"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
    "PyMuPDF>=1.23",
    "requests>=2.31",
]

[project.scripts]
cdash-digester = "cdash_digester.gui.main_window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
