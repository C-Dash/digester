[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdash-digester"
version = "0.1.0"
description = "CDASH Presort Digester — batch folder validator and media cataloguer"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6,<7",
    "Pillow>=10.0,<13",
    "PyMuPDF>=1.23,<2",
    "requests>=2.31,<3",
    "filetype>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-qt>=4,<5",  # GUI signal/widget tests (headless via QT_QPA_PLATFORM)
]

[project.scripts]
cdash-digester = "cdash_digester.gui.app:main"

[tool.setuptools.package-data]
cdash_digester = ["csv_mappings/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
